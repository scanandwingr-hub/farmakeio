<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Προσφορές Φαρμακείου</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({ appId: "9279249c-803b-4d4e-b1ac-2c6b2b1708d1" });
    });
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #f0f4f1; min-height: 100vh; }
    header { background: #1a6b4a; padding: 1.25rem; text-align: center; }
    header h1 { color: #fff; font-size: 1.2rem; font-weight: 700; }
    header p { color: rgba(255,255,255,0.7); font-size: 0.8rem; margin-top: 0.2rem; }
    .container { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #999; margin-bottom: 0.65rem; }
    .offer-card { background: #fff; border-radius: 14px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .offer-img { width: 100%; height: 140px; object-fit: cover; background: #e8f4ee; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .offer-img img { width: 100%; height: 100%; object-fit: cover; }
    .offer-content { padding: 0.85rem 1rem; }
    .offer-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 0.3rem; }
    .offer-name { font-size: 0.95rem; font-weight: 700; color: #1a1a1a; }
    .offer-prices { display: flex; align-items: center; gap: 6px; margin-bottom: 0.4rem; }
    .old-price { font-size: 12px; color: #999; text-decoration: line-through; }
    .new-price { font-size: 15px; font-weight: 700; color: #1a6b4a; }
    .badge { background: #d84a1b; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
    .offer-desc { font-size: 12.5px; color: #666; line-height: 1.5; margin-bottom: 0.5rem; }
    .offer-date { font-size: 11px; color: #aaa; }
    .viber-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #7360f2; color: #fff; font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 700; padding: 0.8rem; border-radius: 14px; text-decoration: none; margin-top: 1.25rem; }
    .loading { text-align: center; padding: 3rem 1rem; color: #888; font-size: 0.9rem; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1a6b4a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fff3f0; border: 1px solid #f5c0b0; border-radius: 12px; padding: 1rem; text-align: center; color: #c0392b; font-size: 0.85rem; margin-top: 1rem; }
    footer { text-align: center; font-size: 0.75rem; color: #aaa; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e5e5; }
  </style>
</head>
<body>

<header>
  <h1>Προσφορές Φαρμακείου</h1>
  <p id="subtitle">Φορτώνω προσφορές...</p>
</header>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Φορτώνω προσφορές...
    </div>
  </div>

  <a href="viber://chat?number=%2B30XXXXXXXXXX" class="viber-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.953 9.953 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm4.93 13.57c-.2.56-.99 1.03-1.62 1.16-.43.09-.99.16-2.88-.62-2.42-.99-3.98-3.45-4.1-3.61-.12-.16-.98-1.3-.98-2.48 0-1.18.62-1.76.84-2 .22-.24.48-.3.64-.3h.46c.15 0 .35-.06.55.42.2.48.68 1.66.74 1.78.06.12.1.26.02.42-.08.16-.12.26-.24.4-.12.14-.25.31-.36.42-.12.11-.24.23-.1.45.14.22.62.97 1.33 1.57.91.81 1.68 1.06 1.92 1.18.24.12.38.1.52-.06.14-.16.6-.7.76-.94.16-.24.32-.2.54-.12.22.08 1.4.66 1.64.78.24.12.4.18.46.28.06.1.06.58-.14 1.14z"/></svg>
    Εγγραφή για προσφορές μέσω Viber
  </a>

  <footer>Ενημερώνεται αυτόματα από το φαρμακείο</footer>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxwC2yIA4nGugWn-ASuLUahWNjdb-p4DROlY6wGBCrKUSgBuH4Tfupj_RXH2kT5QeFRsiQlZUwIK_Z/pub?output=csv";

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      cols.push(cur.trim());
      return {
        date: cols[0] || '',
        name: cols[1] || '',
        oldPrice: cols[2] || '',
        newPrice: cols[3] || '',
        photo: cols[4] || '',
        desc: cols[5] || ''
      };
    }).filter(r => r.name);
  }

  function render(items) {
    const content = document.getElementById('content');
    const subtitle = document.getElementById('subtitle');

    if (!items.length) {
      content.innerHTML = '<div class="error">Δεν βρέθηκαν προσφορές αυτή τη στιγμή.</div>';
      subtitle.textContent = 'Δεν υπάρχουν προσφορές';
      return;
    }

    subtitle.textContent = items.length + ' ενεργές προσφορές';
    let html = '<div class="section-label">Τρέχουσες Προσφορές</div>';

    items.forEach(item => {
      const imgHtml = item.photo
        ? `<div class="offer-img"><img src="${item.photo}" alt="${item.name}" onerror="this.parentElement.innerHTML='💊'"></div>`
        : `<div class="offer-img">💊</div>`;

      html += `
        <div class="offer-card">
          ${imgHtml}
          <div class="offer-content">
            <div class="offer-top">
              <span class="offer-name">${item.name}</span>
              ${item.newPrice ? `<span class="badge">${item.newPrice}</span>` : ''}
            </div>
            ${item.oldPrice ? `<div class="offer-prices"><span class="old-price">${item.oldPrice}</span></div>` : ''}
            ${item.desc ? `<p class="offer-desc">${item.desc}</p>` : ''}
            ${item.date ? `<div class="offer-date">📅 ${item.date}</div>` : ''}
          </div>
        </div>`;
    });

    content.innerHTML = html;
  }

  fetch(CSV_URL)
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(text => render(parseCSV(text)))
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<div class="error">⚠️ Δεν ήταν δυνατή η φόρτωση των προσφορών.</div>';
      document.getElementById('subtitle').textContent = 'Σφάλμα φόρτωσης';
    });
</script>
</body>
</html>
