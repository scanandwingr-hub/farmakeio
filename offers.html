<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Προσφορές Φαρμακείου</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f6e56">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({ appId: "9279249c-803b-4d4e-b1ac-2c6b2b1708d1" });
    });
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #f0f4f1; min-height: 100vh; }
    header { background: #0f6e56; padding: 1.25rem 1rem 1rem; text-align: center; }
    .ph-tag { display: inline-block; background: rgba(255,255,255,0.15); color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-bottom: 0.5rem; }
    header h1 { color: #fff; font-size: 1.25rem; font-weight: 500; margin: 0; }
    header p { color: rgba(255,255,255,0.65); font-size: 0.82rem; margin-top: 2px; }
    .container { max-width: 480px; margin: 0 auto; padding: 0.85rem 0.85rem 2rem; }
    .section-lbl { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #999; margin: 1rem 0 0.5rem; }
    .offer-card { background: #fff; border-radius: 14px; margin-bottom: 10px; overflow: hidden; border: 0.5px solid #e0e0e0; }
    .offer-emoji-wrap { background: #e1f5ee; height: 90px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; }
    .offer-body { padding: 0.8rem 1rem; }
    .offer-name { font-size: 1rem; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
    .offer-desc { font-size: 13.5px; color: #666; line-height: 1.5; margin-bottom: 8px; }
    .offer-footer { display: flex; align-items: center; justify-content: space-between; }
    .price-row { display: flex; align-items: baseline; gap: 8px; }
    .old-p { font-size: 13px; color: #aaa; text-decoration: line-through; }
    .new-p { font-size: 15px; font-weight: 500; color: #0f6e56; }
    .exp-tag { font-size: 11px; color: #aaa; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 10px; }
    .grid .offer-card { margin-bottom: 0; }
    .grid .offer-emoji-wrap { height: 75px; font-size: 2.2rem; }
    .grid .offer-body { padding: 0.65rem 0.75rem; }
    .grid .offer-name { font-size: 0.82rem; }
    .grid .offer-desc { font-size: 11.5px; margin-bottom: 6px; }
    .grid .new-p { font-size: 12px; }
    .grid .old-p { font-size: 11px; }
    .loading { text-align: center; padding: 3rem 1rem; color: #888; }
    .spinner { width: 30px; height: 30px; border: 3px solid #e0e0e0; border-top-color: #0f6e56; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fff3f0; border: 1px solid #f5c0b0; border-radius: 12px; padding: 1rem; text-align: center; color: #c0392b; font-size: 0.85rem; }
    footer { text-align: center; font-size: 11px; color: #bbb; margin-top: 1rem; padding-top: 0.85rem; border-top: 0.5px solid #e5e5e5; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .offer-card { animation: fadeUp 0.8s ease forwards; opacity: 0; }
    .offer-card:nth-child(1) { animation-delay: 0.1s; }
    .offer-card:nth-child(2) { animation-delay: 0.25s; }
    .offer-card:nth-child(3) { animation-delay: 0.4s; }
    .offer-card:nth-child(4) { animation-delay: 0.55s; }
    .offer-card:nth-child(5) { animation-delay: 0.7s; }
  </style>
</head>
<body>

<header>
  <span class="ph-tag" id="count-tag">Φορτώνω...</span>
  <h1>Προσφορές Φαρμακείου</h1>
  <p id="subtitle"></p>
</header>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Φορτώνω προσφορές...
    </div>
  </div>
  <footer>Ενημερώνεται αυτόματα από το φαρμακείο</footer>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRInImlJKQc9KwPxrzmCcXsmlM5s5g6bldVMrhlH_ar1_DMpKUPKqFzuHfhDq_l1P1FKeF-HOq041Gu/pub?output=csv";

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      cols.push(cur.trim());
      return {
        name: cols[1] || '',
        oldPrice: cols[2] || '',
        newPrice: cols[3] || '',
        emoji: cols[4] || '💊',
        desc: cols[5] || '',
        expiry: cols[6] || ''
      };
    }).filter(r => {
      if (!r.name) return false;
      if (r.expiry) {
        const exp = new Date(r.expiry);
        if (!isNaN(exp)) {
          exp.setHours(23, 59, 59);
          if (exp < new Date()) return false;
        }
      }
      return true;
    });
  }

  function expiryHtml(expiry) {
    if (!expiry) return '';
    const exp = new Date(expiry);
    if (isNaN(exp)) return '';
    return `<div class="exp-tag">⏱ Έως ${exp.toLocaleDateString('el-GR')}</div>`;
  }

  function extractEmoji(str) {
    if (!str) return '💊';
    const match = str.match(/\p{Emoji}/u);
    return match ? match[0] : '💊';
  }

  function cardHtml(item, featured) {
    const emojiH = featured ? 90 : 75;
    const emoji = extractEmoji(item.emoji);
    return `
      <div class="offer-card">
        <div class="offer-emoji-wrap" style="height:${emojiH}px;">${emoji}</div>
        <div class="offer-body">
          <div class="offer-name">${item.name}</div>
          ${item.desc ? `<div class="offer-desc">${item.desc}</div>` : ''}
          <div class="offer-footer">
            <div class="price-row">
              ${item.oldPrice ? `<span class="old-p">${item.oldPrice}</span>` : ''}
              ${item.newPrice ? `<span class="new-p">${item.newPrice}</span>` : ''}
            </div>
            ${expiryHtml(item.expiry)}
          </div>
        </div>
      </div>`;
  }

  function render(items) {
    const content = document.getElementById('content');
    const countTag = document.getElementById('count-tag');
    const subtitle = document.getElementById('subtitle');

    if (!items.length) {
      content.innerHTML = '<div class="error">Δεν βρέθηκαν προσφορές αυτή τη στιγμή.</div>';
      countTag.textContent = '0 προσφορές';
      return;
    }

    const now = new Date();
    subtitle.textContent = now.toLocaleDateString('el-GR', { month: 'long', year: 'numeric' });
    countTag.textContent = items.length + ' ενεργές προσφορές';

    const [featured, ...rest] = items;
    let html = '';

    html += cardHtml(featured, true);

    if (rest.length) {
      html += '<div class="grid">';
      rest.forEach(item => { html += cardHtml(item, false); });
      html += '</div>';
    }

    content.innerHTML = html;
  }

  fetch(CSV_URL)
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(text => render(parseCSV(text)))
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<div class="error">⚠️ Δεν ήταν δυνατή η φόρτωση των προσφορών.</div>';
      document.getElementById('count-tag').textContent = 'Σφάλμα';
    });
</script>
</body>
</html>
